# Эксперимент №3: 6 эпох на расширенном датасете v2 (~3200 пар).
# Цель: поднять точность ссылок на статью (11% у e3 → цель 25%+).
# Логика: больше данных (~6 пар/статью) + больше проходов = сильнее мемоизация
# сопоставления «тема → номер статьи».
model:
  name: unsloth/Qwen2.5-7B-Instruct
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  dataset: data/processed/train.jsonl
  val_dataset: data/processed/val.jsonl
  epochs: 4
  lr: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.05
  per_device_batch_size: 2
  grad_accum_steps: 4
  weight_decay: 0.01
  seed: 42
  fp16: true
  logging_steps: 10
  save_steps: 300

output:
  adapter_dir: outputs/adapter_e6_v2
  sample_n: 10
  push_to_hub: false
  hf_repo: ""

wandb:
  project: tk-assistant
  enabled: false

report_to: tensorboard
