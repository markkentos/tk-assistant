services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    command: >-
      -m /models/qwen2.5-7b-tk-q4_k_m.gguf
      --host 0.0.0.0 --port 8080
      -c 4096 -t 0
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - llama-server

volumes:
  caddy_data:
  caddy_config:
